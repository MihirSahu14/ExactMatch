<!DOCTYPE html>
<html lang="en" data-mode="shopper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExactMatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3efe7;
    --ink: #1b1714;
    --muted: #6f675e;
    --faint: #8a8176;
    --card: rgba(255, 252, 247, .9);
    --card-solid: #fffcf7;
    --line: rgba(28, 23, 18, .1);
    --good: #0c6a45;
    --good-soft: #e6f3ec;
    --bad: #9c3b2e;
    --bad-soft: #f8ebe6;
    --shadow: 0 24px 60px rgba(70, 46, 22, .07);
    --serif: "Instrument Serif", Palatino, "Iowan Old Style", Georgia, serif;
    --sans: "Instrument Sans", "Avenir Next", "Segoe UI", sans-serif;
    --pad: 28px;
  }
  html[data-mode="analyst"] {
    --bg: #101412;
    --ink: #f4f0e8;
    --muted: #b7b1a6;
    --faint: #8d877c;
    --card: #1a211d;
    --card-solid: #1a211d;
    --line: rgba(244, 240, 232, .12);
    --good: #9ddec0;
    --good-soft: rgba(157, 222, 192, .12);
    --bad: #ffb4a8;
    --bad-soft: rgba(255, 180, 168, .1);
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font: 16px/1.4 var(--sans);
    color: var(--ink);
    background:
      radial-gradient(1000px 480px at 0% -10%, #f8e6cf, transparent 55%),
      radial-gradient(900px 520px at 100% -5%, #dceae3, transparent 52%),
      var(--bg);
  }
  html[data-mode="analyst"] body {
    background:
      radial-gradient(820px 420px at 100% -18%, #1c4034, transparent 52%),
      var(--bg);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { max-width: 1080px; margin: 0 auto; padding: 22px var(--pad) 48px; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 28px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: -0.03em; }
  .mark {
    width: 28px; height: 28px; border-radius: 8px;
    display: grid; place-items: center;
    background: var(--ink); color: var(--bg);
    font-family: var(--serif); font-size: 18px;
  }
  .switch {
    display: grid; grid-template-columns: 1fr 1fr;
    background: rgba(27, 23, 20, .06);
    padding: 4px; border-radius: 999px; gap: 2px;
  }
  html[data-mode="analyst"] .switch { background: rgba(244, 240, 232, .08); }
  .switch button {
    border: 0; background: transparent; border-radius: 999px;
    padding: 8px 22px; color: var(--muted);
  }
  .switch button[aria-selected="true"] {
    background: var(--card-solid); color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.12);
  }
  html[data-mode="analyst"] .switch button[aria-selected="true"] {
    background: #f4f0e8; color: #141816;
  }
  .intro h1 {
    font-family: var(--serif); font-weight: 400; font-size: 58px;
    letter-spacing: -0.035em; line-height: .96; margin: 0;
    max-width: 11em;
  }
  .intro h1 em { font-style: italic; }
  .intro p { margin: 14px 0 0; color: var(--muted); max-width: 42em; font-size: 17px; }
  body.has-result .intro { display: none; }
  form {
    display: flex; gap: 8px; margin: 22px 0 14px; max-width: 680px;
  }
  input[type="url"] {
    flex: 1; border: 1px solid var(--line); background: var(--card-solid);
    border-radius: 14px; padding: 14px 16px; outline: none;
    box-shadow: var(--shadow);
  }
  input::placeholder { color: var(--faint); }
  form button, .ghost {
    border: 0; border-radius: 14px; padding: 14px 18px;
    background: var(--ink); color: var(--bg);
  }
  html[data-mode="analyst"] form button { background: #f4f0e8; color: #141816; }
  form button:disabled { opacity: .55; cursor: wait; }
  .quick { display: flex; gap: 8px; flex-wrap: wrap; min-height: 32px; }
  .quick button {
    border: 1px solid var(--line); background: transparent;
    border-radius: 999px; padding: 6px 12px; color: var(--muted); font-size: 13px;
  }
  .quick button.on { color: var(--ink); border-color: var(--ink); }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px; }
  .scene {
    text-align: left; border: 1px solid var(--line); background: var(--card);
    border-radius: 22px; padding: 22px 22px 18px; box-shadow: var(--shadow);
    min-height: 168px; display: flex; flex-direction: column; gap: 8px;
  }
  .scene:hover { transform: translateY(-2px); }
  .kicker {
    margin: 0;
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint);
  }
  .scene strong {
    font-family: var(--serif); font-weight: 400; font-size: 40px;
    letter-spacing: -0.03em; line-height: .95;
  }
  .scene .hook { color: var(--muted); margin-top: auto; }
  .scene .opened { color: var(--faint); font-size: 14px; }
  .status { color: var(--bad); min-height: 0; margin: 8px 0 0; }
  .hero { margin-top: 8px; }
  .product-name {
    font-family: var(--serif); font-weight: 400; font-size: 34px;
    letter-spacing: -0.03em; line-height: 1.02; margin: 0;
    text-transform: none; color: var(--ink);
  }
  .hint { color: var(--muted); font-size: 13px; margin: -2px 0 4px; }
  .model {
    display: inline-block; margin-top: 8px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted);
  }
  .equation {
    display: grid; grid-template-columns: 1fr auto 1.15fr; gap: 18px;
    align-items: stretch; margin: 18px 0 8px;
  }
  .eq {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .eq.best { background: var(--good-soft); border-color: transparent; }
  .eq .k { display: block; color: var(--faint); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  .eq .amt {
    display: block; font-family: var(--serif); font-size: 52px; letter-spacing: -0.04em; line-height: 1;
    margin: 6px 0 4px;
  }
  .eq.best .amt { color: var(--good); }
  .where { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .arrow {
    align-self: center; color: var(--faint); font-family: var(--serif); font-size: 32px;
  }
  h2 {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--faint); font-weight: 500; margin: 22px 0 10px;
  }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .row {
    display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 12px 14px;
  }
  .logo {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    color: white; font-weight: 600; font-size: 14px; letter-spacing: -0.03em;
  }
  .row .store { font-weight: 600; letter-spacing: -0.02em; }
  .row .title { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .row .why { color: var(--good); font-size: 13px; margin-top: 4px; }
  .amt-sm { font-family: var(--serif); font-size: 28px; letter-spacing: -0.03em; text-align: right; }
  .pill {
    display: inline-block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    border-radius: 999px; padding: 3px 8px; margin-left: 8px; vertical-align: 2px;
  }
  .pill.best { background: var(--good); color: white; }
  html[data-mode="analyst"] .pill.best { color: #10231b; }
  .trap {
    margin-top: 14px; border-radius: 18px; padding: 14px 16px;
    background: var(--bad-soft); border: 1px solid transparent;
    display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
  }
  .trap h2 { margin: 0 0 6px; color: var(--bad); }
  .trap .title { color: var(--ink); }
  .trap .why { color: var(--bad); font-size: 14px; margin-top: 4px; }
  .trap .amt-sm { color: var(--bad); }
  .less { display: block; font-size: 13px; color: var(--bad); text-align: right; }
  .desk { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 8px 14px 14px;
  }
  .panel h2 { margin-top: 12px; }
  .line {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 10px;
    align-items: start; padding: 12px 0; border-top: 1px solid var(--line);
  }
  .tag {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    border-radius: 999px; padding: 4px 8px; width: fit-content;
  }
  .tag.ok { background: var(--good-soft); color: var(--good); }
  .tag.no { background: var(--bad-soft); color: var(--bad); }
  .line .title { font-size: 14px; }
  .line .why { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .line .amt-sm { font-size: 22px; }
  .meter { height: 3px; border-radius: 99px; background: var(--line); margin-top: 8px; }
  .meter span { display: block; height: 100%; border-radius: 99px; background: var(--good); }
  .incoming {
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px 18px;
  }
  .incoming .product-name { font-size: 30px; }
  .foot { margin-top: 16px; color: var(--faint); font-size: 13px; }
  .empty-note { color: var(--muted); padding: 8px 0; }
  .rise { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  @media (max-width: 800px) {
    .intro h1 { font-size: 42px; }
    .cards, .equation, .desk { grid-template-columns: 1fr; }
    .arrow { transform: rotate(90deg); justify-self: center; }
    .eq .amt { font-size: 42px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rise, .scene { animation: none; transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="mark">E</span> ExactMatch</div>
    <div class="switch" role="tablist" aria-label="Experience">
      <button type="button" id="tab-shopper" role="tab" aria-selected="true">Shopper</button>
      <button type="button" id="tab-analyst" role="tab" aria-selected="false">Analyst</button>
    </div>
  </header>
  <section class="intro" id="intro"></section>
  <form id="form">
    <input id="url" type="url" placeholder="Paste a product link" aria-label="Product URL">
    <button id="go" type="submit">Find it</button>
  </form>
  <div class="quick" id="quick"></div>
  <p id="status" class="status" role="status"></p>
  <div id="stage"></div>
</div>
<script>
const MARKS = {
  "Best Buy": ["BB", "#0046be"],
  "Amazon": ["a", "#232f3e"],
  "Walmart": ["W", "#0071ce"],
  "Sony.com": ["So", "#111111"],
  "Crutchfield": ["Cf", "#c45500"],
  "Target": ["T", "#cc0000"],
  "B&H": ["BH", "#1a1a1a"],
  "Abt": ["Abt", "#c8102e"]
};

let mode = "shopper";
let data = null;
let scenes = [];
let busy = false;

const intro = document.getElementById("intro");
const stage = document.getElementById("stage");
const status = document.getElementById("status");
const quick = document.getElementById("quick");
const form = document.getElementById("form");
const urlInput = document.getElementById("url");

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text;
  return node;
}
function money(n) {
  if (n == null || Number.isNaN(Number(n))) return "";
  return Number(n).toLocaleString("en-US", {style: "currency", currency: "USD"});
}
function markFor(store) {
  return MARKS[store] || [((store || "?").slice(0, 1).toUpperCase()), "#3f3a34"];
}
function storeOf(row) {
  return row.store || (row.attrs && row.attrs.store) || row.brand || "Store";
}
function bestRow(rows) {
  const priced = rows.filter((row) => row.price != null);
  if (!priced.length) return null;
  return priced.reduce((a, b) => a.price <= b.price ? a : b);
}
function trapRow(payload) {
  const best = bestRow(payload.ours);
  if (!best || best.price == null) return payload.rejected[0] || null;
  const pool = payload.rejected.filter((row) => row.price != null && row.price < best.price);
  pool.sort((a, b) => b.score - a.score || b.price - a.price);
  return pool[0] || null;
}
function showModel(model) {
  const sony = String(model || "").match(/^(WH|WF)(\d{3,4})(XM\d+)$/);
  return sony ? sony[1] + "-" + sony[2] + sony[3] : (model || "");
}
function shopperWhy(row) {
  const other = (row.evidence || "").split("conflicts with")[1];
  if (other) return "Different model · " + showModel(other.trim());
  const same = (row.evidence || "").match(/model no\.\s+(\S+)\s+matches/);
  if (same) return "Same model · " + showModel(same[1]);
  return row.evidence;
}
function viaLabel(via) {
  if (via === "rule") return "Rule";
  if (via === "fireworks") return "Fireworks";
  if (via === "embedding") return "Embedding";
  return "Unchecked";
}

function renderIntro() {
  intro.replaceChildren();
  const h1 = el("h1");
  if (mode === "shopper") {
    h1.append("The best price on this ", el("em", null, "exact"), " product.");
    intro.append(h1, el("p", null, "Paste a link from any store. See that same model everywhere else. A cheaper lookalike never becomes the best price."));
  } else {
    h1.append("Every listing of that SKU, ", el("em", null, "with the reason."), "");
    intro.append(h1, el("p", null, "The lookup a catalog team runs. Keyword search is on the left. Exact matches, and the near-miss it blocked, are on the right."));
  }
}

function renderQuick() {
  quick.replaceChildren();
  scenes.forEach((scene) => {
    const button = el("button", data && data.scene === scene.id ? "on" : "", scene.label);
    button.type = "button";
    button.addEventListener("click", () => loadScene(scene.id));
    quick.append(button);
  });
}

function logo(store) {
  const [letters, color] = markFor(store);
  const node = el("div", "logo", letters);
  node.style.background = color;
  return node;
}

function shopper(payload) {
  const rec = payload.record;
  const ours = payload.ours.slice().sort((a, b) => (a.price ?? 1e12) - (b.price ?? 1e12));
  const best = bestRow(ours);
  const trap = trapRow(payload);
  const wrap = el("div", "hero rise");
  wrap.append(el("p", "kicker", "The page you opened · " + storeOf(rec)));
  wrap.append(el("p", "product-name", rec.title || "Product"));
  if (rec.model_number) wrap.append(el("span", "model", "Model " + showModel(rec.model_number)));

  if (best) {
    const eq = el("div", "equation");
    const from = el("div", "eq");
    from.append(el("span", "k", "Page you opened"));
    from.append(el("span", "amt", money(rec.price) || "—"));
    from.append(el("span", "where", (rec.attrs && rec.attrs.store) || "This listing"));
    const arrow = el("div", "arrow", "→");
    const to = el("div", "eq best");
    to.append(el("span", "k", "Best exact price"));
    to.append(el("span", "amt", money(best.price)));
    let where = storeOf(best);
    if (rec.price != null && best.price != null && rec.price > best.price) {
      where += " · save " + money(rec.price - best.price);
    }
    to.append(el("span", "where", where));
    eq.append(from, arrow, to);
    wrap.append(eq);
  }

  const count = ours.length === 1 ? "1 store has this exact model" : ours.length + " stores have this exact model";
  wrap.append(el("h2", null, count));
  if (!ours.length) wrap.append(el("p", "empty-note", "No other listing is this exact product."));
  const stack = el("div", "stack");
  ours.forEach((row, i) => {
    const card = el("article", "row");
    card.style.animationDelay = (i * 40) + "ms";
    card.append(logo(storeOf(row)));
    const mid = el("div");
    const name = el("div", "store", storeOf(row));
    if (best && row.product_id === best.product_id) name.append(el("span", "pill best", "Best price"));
    mid.append(name, el("div", "title", row.title), el("div", "why", shopperWhy(row)));
    card.append(mid, el("div", "amt-sm", money(row.price)));
    stack.append(card);
  });
  wrap.append(stack);

  if (trap) {
    const box = el("div", "trap");
    const mid = el("div");
    mid.append(el("h2", null, "Cheaper, and not this product"));
    mid.append(el("div", "title", storeOf(trap) + " · " + trap.title));
    mid.append(el("div", "why", shopperWhy(trap)));
    const price = el("div");
    price.append(el("div", "amt-sm", money(trap.price)));
    if (best && trap.price != null) price.append(el("span", "less", money(best.price - trap.price) + " less"));
    box.append(mid, price);
    wrap.append(box);
  }
  return wrap;
}

function decision(row, ok) {
  const line = el("div", "line");
  line.append(el("span", ok ? "tag ok" : "tag no", ok ? "Match" : "Reject"));
  const mid = el("div");
  mid.append(el("div", "store", storeOf(row)));
  mid.append(el("div", "title", row.title));
  mid.append(el("div", "why", row.evidence));
  const meter = el("div", "meter");
  const fill = el("span");
  fill.style.width = Math.round((row.confidence || 0) * 100) + "%";
  if (!ok) fill.style.background = "var(--bad)";
  meter.append(fill);
  mid.append(meter, el("div", "why", Math.round((row.confidence || 0) * 100) + "% · " + viaLabel(row.via)));
  line.append(mid, el("div", "amt-sm", money(row.price)));
  return line;
}

function baselineLine(row) {
  const line = el("div", "line");
  line.append(el("span", row.accepted ? "tag ok" : "tag no", row.accepted ? "Listed" : "Wrong"));
  const mid = el("div");
  mid.append(el("div", "store", storeOf(row)));
  mid.append(el("div", "title", row.title));
  if (!row.accepted) mid.append(el("div", "why", row.evidence));
  line.append(mid, el("div", "amt-sm", money(row.price)));
  return line;
}

function analyst(payload) {
  const rec = payload.record;
  const wrap = el("div", "rise");
  const incoming = el("div", "incoming");
  incoming.append(el("div", "kicker", "Incoming offer · " + storeOf(rec)));
  incoming.append(el("p", "product-name", rec.title || "Product"));
  const bits = [rec.brand, rec.model_number ? "Model " + rec.model_number : "", money(rec.price)].filter(Boolean).join(" · ");
  if (bits) incoming.append(el("p", "where", bits));
  wrap.append(incoming);

  const desk = el("div", "desk");
  const left = el("section", "panel");
  left.append(el("h2", null, "Keyword search"));
  left.append(el("p", "hint", "Similar titles, including lookalikes."));
  if (!payload.baseline.length) left.append(el("p", "empty-note", "Nothing similar in the catalog."));
  payload.baseline.forEach((row) => left.append(baselineLine(row)));

  const right = el("section", "panel");
  right.append(el("h2", null, "ExactMatch"));
  right.append(el("p", "hint", "Kept matches, and the lookalike it refused."));
  const matches = payload.ours.slice().sort((a, b) => (a.price ?? 1e12) - (b.price ?? 1e12));
  if (!matches.length) right.append(el("p", "empty-note", "No exact listing. Returning nothing is a valid answer."));
  matches.forEach((row) => right.append(decision(row, true)));
  const blocked = payload.rejected.slice(0, 2);
  blocked.forEach((row) => right.append(decision(row, false)));
  desk.append(left, right);
  wrap.append(desk);

  const foot = el("p", "foot");
  foot.textContent = payload.llm_calls
    ? payload.llm_calls + " Fireworks checks · $" + Number(payload.cost_usd).toFixed(4) + " · " + payload.tokens + " tokens"
    : "Model-number rules decided this lookup. Fireworks was not called.";
  wrap.append(foot);
  return wrap;
}

function render() {
  document.documentElement.dataset.mode = mode;
  document.getElementById("tab-shopper").setAttribute("aria-selected", mode === "shopper");
  document.getElementById("tab-analyst").setAttribute("aria-selected", mode === "analyst");
  document.body.classList.toggle("has-result", Boolean(data));
  renderIntro();
  renderQuick();
  stage.replaceChildren();
  if (!data) {
    const cards = el("div", "cards");
    scenes.forEach((scene, i) => {
      const button = el("button", "scene rise");
      button.type = "button";
      button.style.animationDelay = (i * 60) + "ms";
      button.append(el("div", "kicker", scene.kicker));
      button.append(el("strong", null, scene.label.replace(/^Sony\s+/, "")));
      button.append(el("div", "hook", scene.hook));
      button.append(el("div", "opened", scene.store + " · " + money(scene.price)));
      button.addEventListener("click", () => loadScene(scene.id));
      cards.append(button);
    });
    stage.append(cards);
    return;
  }
  stage.append(mode === "shopper" ? shopper(data) : analyst(data));
}

async function loadScene(id) {
  if (busy) return;
  busy = true;
  status.textContent = "";
  document.getElementById("go").disabled = true;
  try {
    const response = await fetch("/api/scene", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({id})
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || "Lookup failed");
    data = payload;
    render();
  } catch (err) {
    status.textContent = err.message;
  } finally {
    busy = false;
    document.getElementById("go").disabled = false;
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const url = urlInput.value.trim();
  if (!url || busy) return;
  busy = true;
  status.textContent = "Reading the page…";
  document.getElementById("go").disabled = true;
  try {
    const response = await fetch("/api/lookup", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({url})
    });
    const payload = await response.json();
    if (!response.ok) throw new Error(payload.error || "Lookup failed");
    data = payload;
    status.textContent = "";
    render();
  } catch (err) {
    status.textContent = err.message;
  } finally {
    busy = false;
    document.getElementById("go").disabled = false;
  }
});

document.getElementById("tab-shopper").addEventListener("click", () => { mode = "shopper"; render(); });
document.getElementById("tab-analyst").addEventListener("click", () => { mode = "analyst"; render(); });

fetch("/api/scenes").then((r) => r.json()).then((rows) => { scenes = rows; render(); });
</script>
</body>
</html>
